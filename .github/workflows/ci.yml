name: CI

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/odin-lang/odin/releases/latest" -Headers @{ "User-Agent" = "wcu-ci" }
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "no Windows amd64 Odin release asset found" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile odin.zip
          Expand-Archive odin.zip -DestinationPath odin

      - name: Add Odin to PATH
        shell: pwsh
        run: |
          "${{ github.workspace }}\odin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check
        run: .\build.ps1 check

      - name: Build
        run: .\build.ps1 build

      - name: Test
        run: .\build.ps1 test

      - name: Format check
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/DanielGavin/ols/releases/latest/download/ols-x86_64-pc-windows-msvc.zip" -OutFile ols.zip
          Expand-Archive ols.zip -DestinationPath ols
          Rename-Item "ols\odinfmt-x86_64-pc-windows-msvc.exe" "odinfmt.exe"
          $files = Get-ChildItem -Recurse -Filter *.odin | ForEach-Object { $_.FullName }
          .\ols\odinfmt.exe -w $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- "*.odin"
          if ($LASTEXITCODE -ne 0) { Write-Host "odinfmt would change files; run odinfmt -w before committing"; exit 1 }
